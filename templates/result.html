<!DOCTYPE html>
<html>
<head>
    <title>YouTube Downloader</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<h1>{{title}}</h1>

<img src="{{thumbnail}}" width="300">

<p>Duration: {{duration}} seconds</p>


<form action="/start-download" method="POST">

<input type="hidden" name="url" value="{{url}}">


<label>Quality:</label>

<select name="quality">

{% for q in qualities %}
<option value="{{q}}">
{{q}}
</option>
{% endfor %}

</select>


<br><br>


<label>Format:</label>

<select name="format">

<option value="mp4">MP4 Video</option>
<option value="mp3">MP3 Audio</option>

</select>


<br><br>


<button type="submit">
Download
</button>


</form>


</div>

</body>
</html>
